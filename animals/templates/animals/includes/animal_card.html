<article class="card room-card mb-3">
    <div class="card-body">
        <h2 class="card-title">
            {{ animal.name|default:"Без клички" }}
        </h2>

        <p class="card-text">
            Вид: {{ animal.species }}.
            Суточная норма: {{ animal.daily_norm }} г
            {% if animal.is_large_norm %}
                <span class="badge bg-info text-dark">большая норма</span>
            {% endif %}
        </p>

        <a
            href="{{ animal.get_absolute_url }}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
